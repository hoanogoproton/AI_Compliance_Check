crop:
- 241
- 190
- 969
- 889
model:
  path: yolo11n-pose.pt
  conf: 0.4
  iou: 0.2
output:
  dir: ./outputs/RAI7-2
  visualize: true
  context_seconds: 2
  crop_padding: 10
  debug_keypoints: true
zones:
  Work:
    label: Work
    points:
    - - 277.0
      - 339.0
    - - 440.0
      - 285.0
    - - 447.0
      - 51.0
    - - 959.0
      - 227.0
    - - 889.0
      - 828.0
    - - 626.0
      - 880.0
    - - 260.0
      - 530.0
  JIG:
    label: JIG
    points:
    - - 402.0
      - 379.0
    - - 319.0
      - 415.0
    - - 411.0
      - 499.0
    - - 492.0
      - 452.0
behaviors:
- name: hand_to_head
  enabled: false
  params:
    distance_threshold_ratio: 0.9
    vertical_offset_ratio: 0.2
    keypoint_conf_threshold: 0.5
    head_keypoint_conf_threshold: 0.2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: leave_zone
  enabled: true
  params:
    zones:
    - Work
    min_stay_frames: 14
    leave_flash_frames: 14
- name: hand_in_zone
  enabled: false
  params:
    hand: any
    min_duration_frames: 1
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn
  enabled: true
  params:
    turn_threshold_ratio: 0.3
    window_frames: 21
    max_turns: 2
    confirmation_frames: 1
    max_gap_frames: 1
    min_event_frames: 1
- name: hand_shake_object
  enabled: true
  params:
    zones:
    - JIG
    window_seconds: 2.0
    min_reversals: 3
    min_displacement_ratio: 0.01
    min_amplitude_ratio: 0.12
    min_frequency_hz: 0.5
    max_frequency_hz: 3.4
    smoothing_tau: 0.1
    keypoint_conf_threshold: 0.5
    confirmation_frames: 2
    max_gap_frames: 3
    min_event_frames: 7
- name: body_turn
  enabled: false
  params:
    min_angle: 30.0
    window_seconds: 2.0
    velocity_threshold_deg_s: 30.0
    smoothing_frames: 2
    track_gap_frames: 2
    cooldown_frames: 2
    stale_frames: 70
    confirmation_frames: 2
    max_gap_frames: 2
    min_event_frames: 7
- name: hand_snatch_object
  enabled: true
  params:
    zones:
    - JIG
    min_grasp_frames: 7
    snatch_velocity_ratio: 0.3
    approach_window: 14
    velocity_baseline_ratio: 1.5
    keypoint_conf_threshold: 0.5
    confirmation_frames: 1
    max_gap_frames: 1
    min_event_frames: 1
- name: head_turn_away
  enabled: true
  params:
    min_toward_frames: 3
    min_away_frames: 3
    face_keypoint_confidence_threshold: 0.4
    min_face_keypoints_toward: 4
    max_face_keypoints_away: 2
    body_confidence_threshold: 0.4
    body_min_visible_keypoints: 3
    window_frames: 21
    max_turns: 1
    confirmation_frames: 1
    max_gap_frames: 1
    min_event_frames: 1
- name: head_shake
  enabled: false
  params:
    window_frames: 21
    min_reversals: 4
    yaw_amplitude_threshold: 8.0
    min_face_confidence: 0.5
    max_reprojection_error: 10.0
    confirmation_frames: 3
    max_gap_frames: 5
    min_event_frames: 5
face_detection:
  min_detection_confidence: 0.5
  max_reprojection_error: 10.0
