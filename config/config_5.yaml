crop:
- 241
- 190
- 969
- 889
model:
  path: yolo11n-pose.pt
  conf: 0.4
  iou: 0.2
output:
  dir: ./outputs/RAI7-2
  visualize: true
  context_seconds: 2
  crop_padding: 10
  debug_keypoints: true
zones:
  Work:
    label: Work
    points:
    - - 277.0
      - 339.0
    - - 440.0
      - 285.0
    - - 447.0
      - 51.0
    - - 959.0
      - 227.0
    - - 889.0
      - 828.0
    - - 626.0
      - 880.0
    - - 260.0
      - 530.0
  JIG:
    label: JIG
    points:
    - - 423.0
      - 372.0
    - - 340.0
      - 402.0
    - - 408.0
      - 464.0
    - - 476.0
      - 421.0
behaviors:
- name: hand_to_head
  enabled: false
  params:
    distance_threshold_ratio: 0.9
    vertical_offset_ratio: 0.2
    keypoint_conf_threshold: 0.5
    head_keypoint_conf_threshold: 0.2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: leave_zone
  enabled: true
  params:
    zones:
    - Work
    min_stay_frames: 14
    leave_flash_frames: 14
- name: hand_in_zone
  enabled: false
  params:
    hand: any
    min_duration_frames: 1
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn
  enabled: false
  params:
    turn_threshold_ratio: 0.3
    window_frames: 21
    max_turns: 2
    confirmation_frames: 2
    max_gap_frames: 1
    min_event_frames: 3
- name: hand_shake_object
  enabled: false
  params:
    zones:
    - JIG
    window_frames: 21
    min_reversals: 3
    min_displacement_ratio: 0.01
    keypoint_conf_threshold: 0.5
- name: body_turn
  enabled: false
  params:
    min_angle: 45.0
    window_frames: 21
    velocity_threshold: 10.0
    confirmation_frames: 30
    max_gap_frames: 2
    min_event_frames: 14
- name: hand_snatch_object
  enabled: false
  params:
    zones:
    - JIG
    min_grasp_frames: 3
    snatch_velocity_ratio: 0.15
    approach_window: 10
    velocity_baseline_ratio: 2.0
    keypoint_conf_threshold: 0.5
    confirmation_frames: 10
    max_gap_frames: 10
    min_event_frames: 15
- name: head_turn_away
  enabled: true
  params:
    min_face_visible_frames: 3
    min_face_hidden_frames: 3
    face_confidence_threshold: 0.3
    body_confidence_threshold: 0.25
    body_min_visible_keypoints: 2
    window_frames: 42
    max_turns: 1
    confirmation_frames: 3
    max_gap_frames: 3
    min_event_frames: 5
- name: head_shake
  enabled: false
  params:
    window_frames: 35
    min_reversals: 4
    yaw_amplitude_threshold: 8.0
    min_face_confidence: 0.5
    max_reprojection_error: 10.0
    confirmation_frames: 3
    max_gap_frames: 5
    min_event_frames: 5
face_detection:
  min_detection_confidence: 0.5
  max_reprojection_error: 10.0
