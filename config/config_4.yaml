behaviors:
- name: hand_to_head
  enabled: false
  params:
    distance_threshold_ratio: 0.9
    vertical_offset_ratio: 0.2
    keypoint_conf_threshold: 0.5
    head_keypoint_conf_threshold: 0.2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: leave_zone
  enabled: false
  params:
    zones:
    - Leave
    min_stay_frames: 14
    leave_flash_frames: 14
- name: hand_in_zone
  enabled: false
  params:
    zones:
    - PHC
    - PHC_2
    - PHC_3
    hand: any
    min_duration_frames: 1
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn
  enabled: false
  params:
    turn_threshold_ratio: 0.3
    window_frames: 21
    max_turns: 2
    confirmation_frames: 2
    max_gap_frames: 1
    min_event_frames: 3
- name: hand_shake_object
  enabled: false
  params:
    window_frames: 28
    min_reversals: 3
    min_displacement_ratio: 0.01
    keypoint_conf_threshold: 0.3
- name: body_turn
  enabled: true
  params:
    min_angle: 70.0
    window_seconds: 2.0
    velocity_threshold_deg_s: 30.0
    smoothing_frames: 3
    track_gap_frames: 10
    cooldown_frames: 7
    stale_frames: 70
    confirmation_frames: 3
    max_gap_frames: 3
    min_event_frames: 7
- name: hand_snatch_object
  enabled: false
  params:
    min_grasp_frames: 3
    snatch_velocity_ratio: 0.1
    approach_window: 10
    velocity_baseline_ratio: 2.0
    keypoint_conf_threshold: 0.3
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn_away
  enabled: true
  params:
    min_toward_frames: 3
    min_away_frames: 3
    face_keypoint_confidence_threshold: 0.4
    min_face_keypoints_toward: 4
    max_face_keypoints_away: 2
    body_confidence_threshold: 0.4
    body_min_visible_keypoints: 3
    window_frames: 21
    max_turns: 1
    confirmation_frames: 1
    max_gap_frames: 2
    min_event_frames: 1
- name: head_shake
  enabled: false
  params:
    window_frames: 21
    min_reversals: 4
    yaw_amplitude_threshold: 8.0
    min_face_confidence: 0.5
    max_reprojection_error: 10.0
    confirmation_frames: 3
    max_gap_frames: 5
    min_event_frames: 5
face_detection:
  min_detection_confidence: 0.5
  max_reprojection_error: 10.0
