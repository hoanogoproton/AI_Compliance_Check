crop:
- 26
- 8
- 1858
- 1060
model:
  path: yolo26n-pose.pt
  conf: 0.4
  iou: 0.2
output:
  dir: ./outputs/PC1
  visualize: true
  context_seconds: 5
  crop_padding: 10
  debug_keypoints: true
zones:
  Work:
    label: Work
    points:
    - - 235.0
      - 260.0
    - - 255.0
      - 461.0
    - - 397.0
      - 1037.0
    - - 1702.0
      - 1044.0
    - - 1840.0
      - 829.0
    - - 1837.0
      - 428.0
    - - 1780.0
      - 197.0
    - - 962.0
      - 90.0
    - - 240.0
      - 97.0
behaviors:
- name: hand_to_head
  enabled: false
  params:
    distance_threshold_ratio: 0.9
    vertical_offset_ratio: 0.2
    keypoint_conf_threshold: 0.5
    head_keypoint_conf_threshold: 0.2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: leave_zone
  enabled: true
  params:
    zones:
    - Work
    min_stay_frames: 14
    leave_flash_frames: 14
- name: hand_in_zone
  enabled: false
  params:
    hand: any
    min_duration_frames: 1
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn
  enabled: false
  params:
    turn_threshold_ratio: 0.3
    window_frames: 21
    max_turns: 2
    confirmation_frames: 2
    max_gap_frames: 1
    min_event_frames: 3
- name: hand_shake_object
  enabled: false
  params:
    window_frames: 28
    min_reversals: 3
    min_displacement_ratio: 0.01
    keypoint_conf_threshold: 0.3
- name: body_turn
  enabled: false
  params:
    min_angle: 45.0
    window_frames: 21
    velocity_threshold: 10.0
    confirmation_frames: 30
    max_gap_frames: 2
    min_event_frames: 14
- name: hand_snatch_object
  enabled: false
  params:
    min_grasp_frames: 3
    snatch_velocity_ratio: 0.1
    approach_window: 10
    velocity_baseline_ratio: 2.0
    keypoint_conf_threshold: 0.3
    confirmation_frames: 3
    max_gap_frames: 1
    min_event_frames: 3
- name: head_turn_away
  enabled: false
  params:
    min_toward_frames: 2
    min_away_frames: 2
    face_keypoint_confidence_threshold: 0.4
    body_confidence_threshold: 0.3
    body_min_visible_keypoints: 2
    window_frames: 42
    max_turns: 1
    min_face_keypoints_toward: 3
    max_face_keypoints_away: 1
