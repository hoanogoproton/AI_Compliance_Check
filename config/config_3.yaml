crop:
- 868
- 171
- 810
- 876
model:
  path: yolo11n-pose.pt
  conf: 0.3
  iou: 0.2
output:
  dir: ./outputs/video3
  visualize: true
  context_seconds: 5
  crop_padding: 10
  debug_keypoints: true
zones:
  Leave:
    label: Leave
    points:
    - - 200.0
      - 18.0
    - - 216.0
      - 837.0
    - - 580.0
      - 812.0
    - - 343.0
      - 23.0
behaviors:
- name: hand_to_head
  enabled: false
  params:
    distance_threshold_ratio: 0.9
    vertical_offset_ratio: 0.2
    keypoint_conf_threshold: 0.5
    head_keypoint_conf_threshold: 0.2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: leave_zone
  enabled: true
  params:
    zones:
    - Leave
    min_stay_frames: 60
    leave_flash_frames: 20
    min_leave_frames: 4
    max_missing_frames: 60
- name: hand_in_zone
  enabled: false
  params:
    hand: any
    min_duration_frames: 5
    confirmation_frames: 20
    max_gap_frames: 5
    min_event_frames: 30
- name: head_turn
  enabled: false
  params:
    turn_threshold_ratio: 0.3
    window_frames: 90
    max_turns: 2
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 30
- name: hand_shake_object
  enabled: false
  params:
    window_frames: 40
    min_reversals: 3
    min_displacement_ratio: 0.01
    keypoint_conf_threshold: 0.5
- name: body_turn
  enabled: true
  params:
    min_angle: 45.0
    window_frames: 15
    velocity_threshold: 10.0
    confirmation_frames: 30
    max_gap_frames: 10
    min_event_frames: 60
- name: hand_snatch_object
  enabled: true
  params:
    zones:
    - Hand_Shake_OBJ
    min_grasp_frames: 3
    snatch_velocity_ratio: 0.15
    approach_window: 10
    velocity_baseline_ratio: 2.0
    keypoint_conf_threshold: 0.5
    confirmation_frames: 10
    max_gap_frames: 10
    min_event_frames: 15